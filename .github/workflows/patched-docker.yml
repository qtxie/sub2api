name: Build patched Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra Docker tag to publish"
        required: false
        default: "patched"
  push:
    branches:
      - patched

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          EXTRA_TAG="${{ github.event.inputs.tag || 'patched' }}"
          echo "name=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "extra_tag=${EXTRA_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # QEMU is only needed for the runtime stage of the non-native arch.
      # The Dockerfile builds frontend/backend on $BUILDPLATFORM and cross
      # compiles the Go binary to $TARGETARCH, so the toolchains stay native.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Multi-arch manifest list: docker pull resolves the host arch.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.extra_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VERSION=patched-${{ steps.image.outputs.short_sha }}
            COMMIT=${{ github.sha }}

      - name: Verify published platforms
        shell: bash
        run: |
          IMAGE="${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}"
          docker buildx imagetools inspect "$IMAGE"
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE" \
              | grep -q "linux/${arch}" || { echo "missing linux/${arch} in ${IMAGE}"; exit 1; }
          done
